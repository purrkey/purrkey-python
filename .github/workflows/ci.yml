name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: fail if the live API contract changed since the last regeneration.
    - cron: "0 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest -q
      - run: uv run mypy

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run python scripts/generate.py --check
      - if: github.event_name == 'schedule'
        run: |
          uv run python scripts/generate.py --fetch
          git diff --exit-code openapi/ src/purrkey/types.py
